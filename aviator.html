<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aviator Demo</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }

    /* Top Bar with Back Button on left and Fullscreen on right */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #161a23;
      padding: 8px 12px;
      border-bottom: 1px solid #222d3d;
      height: 40px;
      box-sizing: border-box;
    }

    .back-btn, .fullscreen-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }

    .fullscreen-btn {
      color: #8c96a5;
      font-size: 11px;
    }

    .game-frame {
      width: 100%;
      height: calc(100vh - 40px);
      border: 0;
      display: block;
    }
  </style>
</head>
<body>

  <!-- Top Bar with Back Button and Fullscreen -->
  <div class="top-bar">
    <button class="back-btn" onclick="goBack()">&lt; Go Back</button>
    <button class="fullscreen-btn" onclick="toggleFullScreen()">View Fullscreen 🔲</button>
  </div>

  <!-- Official Game Frame -->
  <iframe
    class="game-frame"
    src="https://demo.spribe.io/launch/aviator?currency=KES&amp;lang=EN"
    title="Aviator Demo"
    allowfullscreen>
  </iframe>

  <script>
    function goBack() {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        // Change this fallback URL if you want it to go somewhere specific when there's no history
        window.location.href = '/'; 
      }
    }

    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }
  </script>

</body>
  </html>
